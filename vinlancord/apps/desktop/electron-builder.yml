# Empacotamento do Além-Mar (instalador NSIS para Windows; AppImage/deb e dmg preparados).
appId: com.vinlancord.app
productName: Além-Mar
# nome do .exe e da pasta de instalação nova sem acento (o banco do modo anfitrião não gosta de
# acento no caminho). Quem já tinha o app atualiza na mesma pasta de antes (o instalador lê do registro).
executableName: Alem-Mar
copyright: Copyright © 2026 Além-Mar
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**
  - renderer/**
  - build/splash.html
  - build/icon.ico
  - build/icon.png
  - build/tray.png
  - build/badge.png
  - package.json
asar: true
# modo anfitrião: servidor completo (fora do asar: tem executáveis nativos)
extraResources:
  # copia a partir de ../host (e não de ../host/dist): o electron-builder SEMPRE descarta um
  # node_modules que esteja na raiz da origem, e o servidor precisa dos módulos nativos dele
  - from: ../host
    to: host
    filter: ['dist/**/*']
protocols:
  # o esquema continua vinlancord:// para os convites já enviados continuarem funcionando
  - name: Além-Mar
    schemes: [vinlancord]
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: Alem-Mar-Setup-${version}.${ext}
  # Assinatura de código (opcional, recomendada): defina CSC_LINK e CSC_KEY_PASSWORD no ambiente de build.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Além-Mar
  runAfterFinish: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: false
  language: 1046
linux:
  target: [AppImage, deb]
  category: Network
  icon: build/icons
  maintainer: Além-Mar
mac:
  target: dmg
  category: public.app-category.social-networking
  icon: build/icon.png
  extendInfo:
    NSMicrophoneUsageDescription: O Além-Mar usa o microfone nas chamadas de voz.
    NSCameraUsageDescription: O Além-Mar usa a câmera nas chamadas de vídeo.
# Atualização automática pelas Releases do GitHub (repositório público: não precisa de token no app).
# O workflow publica cada versão nova (v1.0.N) com o instalador e o latest.yml.
publish:
  provider: github
  owner: drkptn
  repo: chaveiroDCR
  releaseType: release
