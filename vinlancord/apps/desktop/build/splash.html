<title>Além-Mar</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-app-region: drag; }
  .card { position: absolute; inset: 12px; border-radius: 28px; background: radial-gradient(circle at 50% 38%, #0d2a56, #030915 72%); border: 1px solid #14305a; box-shadow: 0 24px 60px -12px rgba(0,0,0,.75); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: #4f9fe8; filter: blur(90px); opacity: .3; top: 24px; animation: pulse 2.6s ease-in-out infinite; }
  .sea { position: absolute; left: -10%; right: -10%; bottom: -30px; height: 90px; opacity: .55; }
  .sea path { animation: drift 6s ease-in-out infinite alternate; }
  .sea path + path { animation-duration: 8s; animation-direction: alternate-reverse; }
  .logo { position: relative; width: 104px; height: 104px; animation: float 3s ease-in-out infinite; filter: drop-shadow(0 18px 30px rgba(79,159,232,.45)); }
  .logo svg { width: 100%; height: 100%; }
  .name { position: relative; margin-top: 22px; color: #e8f3ff; font-size: 27px; font-weight: 700; letter-spacing: .01em; }
  .name span { background: linear-gradient(120deg, #bfe4ff, #4f9fe8); -webkit-background-clip: text; color: transparent; }
  .bar { position: relative; margin-top: 22px; width: 150px; height: 4px; border-radius: 4px; background: #0e2240; overflow: hidden; }
  .bar i { position: absolute; inset: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #2f7fd6, #cdeaff); animation: load 1.2s ease-in-out infinite; }
  .tip { position: relative; margin-top: 14px; color: #6c88a8; font-size: 12px; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes pulse { 0%,100% { opacity: .22 } 50% { opacity: .4 } }
  @keyframes load { 0% { left: -40% } 100% { left: 100% } }
  @keyframes drift { from { transform: translateX(-4%) } to { transform: translateX(4%) } }
</style>
</head>
