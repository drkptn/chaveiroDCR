<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:" />
<title>Vinlancord</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-app-region: drag; }
  .card { position: absolute; inset: 12px; border-radius: 28px; background: radial-gradient(circle at 50% 30%, #1d1640, #0b0b12 70%); border: 1px solid #262636; box-shadow: 0 24px 60px -12px rgba(0,0,0,.7); display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
  .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; background: #7c5cff; filter: blur(90px); opacity: .35; top: 20px; animation: pulse 2.4s ease-in-out infinite; }
  svg { position: relative; width: 104px; height: 104px; animation: float 2.6s ease-in-out infinite; filter: drop-shadow(0 18px 30px rgba(124,92,255,.5)); }
  .name { position: relative; margin-top: 22px; color: #f2f2f7; font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .name span { background: linear-gradient(120deg, #9b6bff, #22d3ee); -webkit-background-clip: text; color: transparent; }
  .bar { position: relative; margin-top: 22px; width: 150px; height: 4px; border-radius: 4px; background: #1d1d28; overflow: hidden; }
  .bar i { position: absolute; inset: 0; width: 40%; border-radius: 4px; background: linear-gradient(90deg, #7c5cff, #22d3ee); animation: load 1.1s ease-in-out infinite; }
  .tip { position: relative; margin-top: 14px; color: #7d7d90; font-size: 12px; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }
  @keyframes pulse { 0%,100% { opacity: .25 } 50% { opacity: .45 } }
  @keyframes load { 0% { left: -40% } 100% { left: 100% } }
</style>
</head>
<body>
  <div class="card">
    <div class="glow"></div>
    <svg viewBox="0 0 128 128"><defs><linearGradient id="a" x1="10" y1="6" x2="118" y2="122" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#9b6bff"/><stop offset=".5" stop-color="#5b5cf6"/><stop offset="1" stop-color="#1fc8e6"/></linearGradient><linearGradient id="b" x1="64" y1="4" x2="64" y2="64" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><path d="M64 4c38 0 60 4 60 60s-22 60-60 60S4 120 4 64 26 4 64 4z" fill="url(#a)"/><path d="M64 4c38 0 60 4 60 60H4C4 8 26 4 64 4z" fill="url(#b)"/><path d="M33 38 L58 91 Q64 102 70 91 L86 57" fill="none" stroke="#fff" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/><circle cx="95" cy="38" r="9.5" fill="#fff"/><path d="M106 22a22 22 0 0 1 6 18" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="5" stroke-linecap="round"/></svg>
    <div class="name">Vinlan<span>cord</span></div>
    <div class="bar"><i></i></div>
    <div class="tip">Afinando os microfones…</div>
  </div>
</body>
</html>
