# Vinlancord em produção: docker compose --env-file ../.env up -d   (rodar dentro de vinlancord/infra)
# Requisitos: um servidor Linux com IP público, um domínio apontando para ele e as portas liberadas
# (80/443 TCP, 40000-40003 UDP/TCP para mídia, 3478 UDP/TCP e 49160-49200 UDP para o TURN).
name: vinlancord

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vinlancord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: vinlancord
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vinlancord']
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '256mb', '--maxmemory-policy', 'allkeys-lru']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      retries: 5

  server:
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PUBLIC_URL: https://${DOMAIN:?defina DOMAIN no .env}
      DATABASE_URL: postgresql://vinlancord:${POSTGRES_PASSWORD}@postgres:5432/vinlancord
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      TRUST_PROXY: 'true'
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      REGISTRATION_CODE: ${REGISTRATION_CODE:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-Vinlancord <no-reply@localhost>}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      MEDIASOUP_LISTEN_IP: 0.0.0.0
      MEDIASOUP_ANNOUNCED_IP: ${PUBLIC_IP:?defina PUBLIC_IP no .env}
      MEDIASOUP_PORT: 40000
      MEDIASOUP_WORKERS: ${MEDIASOUP_WORKERS:-2}
      STUN_URLS: stun:${DOMAIN}:3478
      TURN_URLS: turn:${DOMAIN}:3478?transport=udp,turn:${DOMAIN}:3478?transport=tcp
      TURN_SECRET: ${TURN_SECRET:?defina TURN_SECRET no .env}
      GIPHY_API_KEY: ${GIPHY_API_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - uploads:/data/uploads
    ports:
      # mídia WebRTC (um par UDP/TCP por worker do mediasoup)
      - '40000-40003:40000-40003/udp'
      - '40000-40003:40000-40003/tcp'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8787/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: '20m', max-file: '5' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [server]
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=${DOMAIN}
      - --external-ip=${PUBLIC_IP}
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/backup.sh:ro
    entrypoint: ['sh', '/backup.sh']

volumes:
  pgdata:
  redisdata:
  uploads:
  caddydata:
  caddyconfig:
