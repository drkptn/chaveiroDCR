# Só a infraestrutura para desenvolvimento (Postgres + Redis + MinIO opcional).
# docker compose -f infra/docker-compose.dev.yml up -d
name: vinlancord-dev
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: vinlancord, POSTGRES_PASSWORD: vinlancord_dev, POSTGRES_DB: vinlancord }
    ports: ['5432:5432']
    volumes: [pgdev:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: vinlancord, MINIO_ROOT_PASSWORD: vinlancord_dev }
    ports: ['9000:9000', '9001:9001']
    profiles: [s3]
volumes:
  pgdev:
