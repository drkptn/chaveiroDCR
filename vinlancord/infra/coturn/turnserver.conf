# coturn para o Vinlancord: retransmite mídia quando a rede do usuário bloqueia UDP direto.
# O segredo (--static-auth-secret) e o realm vêm do docker-compose. Credenciais são temporárias (REST API).
listening-port=3478
fingerprint
use-auth-secret
min-port=49160
max-port=49200
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1
stale-nonce=600
total-quota=200
user-quota=20
# segurança: impede que o TURN seja usado para alcançar redes internas
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
log-file=stdout
simple-log
