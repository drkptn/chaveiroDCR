# Vinlancord: testes automáticos e geração do instalador para Windows.
name: Vinlancord

on:
  push:
    paths: ['vinlancord/**', '.github/workflows/vinlancord.yml']
  pull_request:
    paths: ['vinlancord/**']
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Endereço padrão do servidor embutido no app (vazio = apps/desktop/default-server.txt)'
        required: false
      server_pin:
        description: 'SHA-256 do certificado próprio do servidor (modo só IP)'
        required: false
      publish:
        description: 'Publicar o instalador como Release (download + atualização automática)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: vinlancord

jobs:
  test:
    name: Testes (unitários, integração e ponta a ponta)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vinlancord
          POSTGRES_PASSWORD: vinlancord_dev
          POSTGRES_DB: vinlancord_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vinlancord" --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vinlancord/package-lock.json
      - run: npm ci
      - name: Banco do E2E
        run: PGPASSWORD=vinlancord_dev psql -h localhost -U vinlancord -d vinlancord_test -c 'CREATE DATABASE vinlancord_e2e;'
      - name: Tipos
        run: |
          npx tsc -p packages/shared/tsconfig.json
          (cd apps/server && npx prisma generate && npx tsc -p tsconfig.json)
          npx tsc -p apps/web/tsconfig.json
          npx tsc -p apps/desktop/tsconfig.json
      - name: Testes do pacote compartilhado
        run: npm test -w @vinlancord/shared
      - name: Testes de integração do servidor
        run: npm test -w @vinlancord/server
      - name: Testes do cliente web
        run: npm test -w @vinlancord/web
      - name: Build do cliente web
        run: npm run build -w @vinlancord/web
      - name: Navegador para o E2E
        run: npx playwright install --with-deps chromium
      - name: E2E com dois usuários (chat, voz, vídeo, tela, reconexão)
        run: npm run e2e -w @vinlancord/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-falhas
          path: vinlancord/e2e/test-results

  docker:
    name: Servidor em Docker ${{ matrix.arch }} (instalador de 1 comando + chamada real)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64 }
          # mesma arquitetura das VMs grátis Ampere (ARM) da Oracle Cloud
          - { os: ubuntu-24.04-arm, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar com infra/install.sh (modo CI, TLS local)
        run: sudo VINLANCORD_CI=1 bash infra/install.sh
      - name: Interface e API pela instalação de produção
        run: |
          curl -fsSk https://127.0.0.1/ | grep -q 'id="root"'
          curl -fsSk https://127.0.0.1/api/v1/health
          # o certificado servido é exatamente o gerado pelo instalador (o mesmo que o app fixa)
          served=$(echo | openssl s_client -connect 127.0.0.1:443 2>/dev/null | openssl x509 -noout -fingerprint -sha256)
          mine=$(sudo openssl x509 -in infra/certs/vinlancord.crt -noout -fingerprint -sha256)
          echo "$served"; test "$served" = "$mine"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vinlancord/package-lock.json
      - run: npm ci
      - name: Navegador para o E2E
        run: npx playwright install --with-deps chromium
      - name: E2E contra a instalação Docker (voz, vídeo, tela e personalização)
        run: npx playwright test two-users appearance
        working-directory: vinlancord/e2e
        env:
          E2E_BASE_URL: https://127.0.0.1
      - name: Logs dos serviços
        if: failure()
        run: cd infra && sudo docker compose --env-file ../.env ps && sudo docker compose --env-file ../.env logs --tail 200

  windows-installer:
    name: Instalador para Windows
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vinlancord/package-lock.json
      - run: npm ci
      - name: Modo anfitrião no Windows (servidor no PC + chamada real)
        shell: bash
        run: |
          npm run build -w @vinlancord/web
          npm run build -w @vinlancord/host
          npx playwright install chromium
          mkdir -p "$RUNNER_TEMP/anfitriao"
          VL_DATA_DIR="$RUNNER_TEMP/anfitriao" VL_UPNP=0 VL_PUBLIC_IP=127.0.0.1 node apps/host/dist/runtime.mjs > "$RUNNER_TEMP/anfitriao.log" 2>&1 &
          HOST_PID=$!
          for i in $(seq 1 90); do curl -sfk https://127.0.0.1:47800/api/v1/health && break; sleep 2; done
          cat "$RUNNER_TEMP/anfitriao.log"
          fail=0
          (cd e2e && E2E_BASE_URL=https://127.0.0.1:47800 npx playwright test two-users appearance --trace off) || fail=1
          # desliga servidor e banco: senão o Windows trava os arquivos e o empacotamento falha
          kill $HOST_PID || true
          apps/host/dist/node_modules/@embedded-postgres/windows-x64/native/bin/pg_ctl.exe stop -D "$RUNNER_TEMP/anfitriao/banco/data" -m fast -w || true
          sleep 3
          exit $fail
      - name: Versão (1.0.<número da execução>)
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version -w @vinlancord/desktop
      - name: Gerar instalador (NSIS)
        env:
          VINLANCORD_SERVER_URL: ${{ inputs.server_url || vars.VINLANCORD_SERVER_URL }}
          VINLANCORD_SERVER_PIN: ${{ inputs.server_pin || vars.VINLANCORD_SERVER_PIN }}
          # Assinatura opcional: configure os segredos CSC_LINK e CSC_KEY_PASSWORD
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: npm run dist:win -w @vinlancord/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: Vinlancord-Windows
          path: |
            vinlancord/apps/desktop/release/*.exe
            vinlancord/apps/desktop/release/*.blockmap
            vinlancord/apps/desktop/release/latest.yml
          if-no-files-found: error

  release:
    name: Publicar Release (download e atualização automática)
    runs-on: ubuntu-latest
    needs: [test, docker, windows-installer]
    if: (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vinlancord-Windows
          path: dist
      - name: Criar a Release v1.0.${{ github.run_number }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
        run: |
          ls -la dist
          cp "dist/Vinlancord-Setup-$VERSION.exe" dist/Vinlancord-Setup.exe
          cat > notes.md <<EOF
          **Baixe e instale:** [Vinlancord-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/Vinlancord-Setup.exe)

          O app já vem conectado ao servidor e se atualiza sozinho quando sair uma versão nova.
          Na primeira execução o Windows pode mostrar "O Windows protegeu o computador" (o instalador ainda não tem assinatura digital): clique em **Mais informações → Executar assim mesmo**.
          EOF
          gh release create "v$VERSION" --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Vinlancord $VERSION" --notes-file notes.md --latest \
            dist/Vinlancord-Setup-$VERSION.exe dist/Vinlancord-Setup-$VERSION.exe.blockmap dist/latest.yml dist/Vinlancord-Setup.exe
